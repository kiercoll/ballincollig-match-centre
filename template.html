<title>Collig Match Centre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Club identity is black and white, so the page is monochrome and the ONLY
   colour on it is the green / amber / red match read. That is deliberate:
   colour means difficulty here and nothing else. */
:root{
  --brand:#111110; --brand-soft:#3b3934; --brand-wash:#e9e7e1;
  --mast:#111110; --mast-ink:#ffffff;
  --ground:#f4f3f0; --panel:#ffffff; --sunken:#eceae5;
  --ink:#111110; --ink-2:#55534e; --ink-3:#84817a;
  --line:#dedbd4; --line-hard:#c2beb5;
  --win:#1f7a46; --win-wash:#e3f1e8;
  --even:#a8730f; --even-wash:#faeed6;
  --hard:#a8332a; --hard-wash:#f9e3e0;
  --none:#84817a; --none-wash:#eceae5;
  --shadow:0 1px 2px rgba(17,17,16,.06), 0 6px 18px rgba(17,17,16,.05);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --brand:#ffffff; --brand-soft:#d6d3cc; --brand-wash:#26241f;
    --mast:#000000; --mast-ink:#ffffff;
    --ground:#0d0d0c; --panel:#171715; --sunken:#201f1c;
    --ink:#f2f0ea; --ink-2:#adaaa2; --ink-3:#7f7c74;
    --line:#2a2924; --line-hard:#3d3b34;
    --win:#63c08a; --win-wash:#132318;
    --even:#d9a344; --even-wash:#2a2112;
    --hard:#e07b6c; --hard-wash:#2b1613;
    --none:#8b887f; --none-wash:#1e1d19;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --brand:#ffffff; --brand-soft:#d6d3cc; --brand-wash:#26241f;
  --mast:#000000; --mast-ink:#ffffff;
  --ground:#0d0d0c; --panel:#171715; --sunken:#201f1c;
  --ink:#f2f0ea; --ink-2:#adaaa2; --ink-3:#7f7c74;
  --line:#2a2924; --line-hard:#3d3b34;
  --win:#63c08a; --win-wash:#132318;
  --even:#d9a344; --even-wash:#2a2112;
  --hard:#e07b6c; --hard-wash:#2b1613;
  --none:#8b887f; --none-wash:#1e1d19;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:Archivo,"IBM Plex Sans",sans-serif; margin:0; text-wrap:balance; letter-spacing:-.012em}
a{color:var(--brand)}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--brand); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

/* ---------- masthead ---------- */
.mast{
  background:var(--mast); color:var(--mast-ink); padding:14px 20px;
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
}
/* The club plays in black and white hoops; the band under the masthead is that
   jersey, and it is the one piece of ornament on the page. */
.hoops{height:9px; background:repeating-linear-gradient(90deg,
  var(--mast) 0 26px, var(--mast-ink) 26px 52px); border-bottom:1px solid var(--line)}
.mast .crest{
  height:44px; flex:0 0 auto; border-radius:7px; padding:4px 8px;
  background:#fff; display:grid; place-items:center;
}
.mast .crest img{height:36px; width:auto; display:block}
.mast h1{font-size:17px; font-weight:700; line-height:1.15; color:var(--mast-ink)}
.mast .sub{font-size:11.5px; opacity:.72; letter-spacing:.08em; text-transform:uppercase; font-weight:500}
.mast .spacer{flex:1 1 auto}
.freshness{display:flex; align-items:center; gap:10px; font-size:12px}
.freshness .stamp{font-family:"IBM Plex Mono",monospace; opacity:.85; text-align:right; line-height:1.35}
.btn{
  border:1px solid var(--line-hard); background:var(--panel); color:var(--ink);
  padding:7px 13px; border-radius:7px; cursor:pointer; font-size:13px; font-weight:500;
  display:inline-flex; align-items:center; gap:7px; transition:background .12s,border-color .12s;
}
.btn:hover:not(:disabled){background:var(--sunken); border-color:var(--brand)}
.btn:disabled{opacity:.55; cursor:default}
.btn.ghost{background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.35); color:var(--mast-ink)}
.btn.ghost:hover:not(:disabled){background:rgba(255,255,255,.24); border-color:rgba(255,255,255,.6)}
.btn.primary{background:var(--brand); border-color:var(--brand); color:var(--ground); font-weight:600}
.btn.primary:hover:not(:disabled){background:var(--brand-soft); border-color:var(--brand-soft)}

/* ---------- shell ---------- */
.shell{display:grid; grid-template-columns:230px minmax(0,1fr); gap:0; align-items:start}
.side{
  border-right:1px solid var(--line); padding:16px 12px 40px;
  position:sticky; top:0; max-height:100vh; overflow-y:auto; background:var(--ground);
}
.side .grp{font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-3);
  font-weight:600; margin:16px 8px 6px}
.side .grp:first-child{margin-top:0}
.navbtn{
  display:flex; align-items:baseline; gap:8px; width:100%; text-align:left;
  background:none; border:0; border-radius:7px; padding:7px 9px; cursor:pointer;
  font-size:14px; color:var(--ink-2); transition:background .12s,color .12s;
}
.navbtn:hover{background:var(--sunken); color:var(--ink)}
.navbtn[aria-current="true"]{background:var(--brand); color:var(--ground); font-weight:600}
.navbtn .rec{margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3)}
.navbtn[aria-current="true"] .rec{color:var(--ground); opacity:.75}
.side hr{border:0; border-top:1px solid var(--line); margin:14px 8px}
.navbtn.scoutnav{border:1px solid var(--line-hard); font-weight:600; color:var(--ink); gap:9px}
.navbtn.scoutnav .ico{font-size:13px; color:var(--ink-3)}
.navbtn.scoutnav[aria-current="true"] .ico{color:var(--ground)}
.main{padding:22px 26px 64px; min-width:0}

@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:static; max-height:none; border-right:0; border-bottom:1px solid var(--line);
    display:flex; gap:6px; overflow-x:auto; padding:10px 12px}
  .side .grp,.side hr{display:none}
  .navbtn{width:auto; white-space:nowrap; border:1px solid var(--line); padding:6px 11px}
  .navbtn .rec{display:none}
  .main{padding:18px 14px 56px}
}

/* ---------- team header ---------- */
.teamhead{display:flex; flex-wrap:wrap; gap:16px 22px; align-items:flex-end; margin-bottom:18px}
.teamhead h2{font-size:26px; font-weight:700; line-height:1.1}
.teamhead .comps{display:flex; flex-wrap:wrap; gap:5px; margin-top:8px}
.tag{
  font-size:11.5px; padding:3px 8px; border-radius:5px; background:var(--sunken);
  color:var(--ink-2); border:1px solid var(--line); text-decoration:none;
}
a.tag:hover{border-color:var(--brand); color:var(--brand)}
.record{display:flex; gap:0; margin-left:auto; border:1px solid var(--line); border-radius:var(--r);
  overflow:hidden; background:var(--panel)}
.record div{padding:7px 14px; text-align:center; border-right:1px solid var(--line)}
.record div:last-child{border-right:0}
.record .k{font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3); font-weight:600}
.record .v{font-family:Archivo; font-weight:700; font-size:19px; font-variant-numeric:tabular-nums; line-height:1.2}

/* ---------- tabs ---------- */
.tabs{display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:18px; overflow-x:auto}
.tab{
  background:none; border:0; border-bottom:2px solid transparent; padding:9px 14px;
  cursor:pointer; font-size:14px; font-weight:500; color:var(--ink-3); white-space:nowrap;
}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--brand); border-bottom-color:var(--brand); font-weight:600}
.tab .n{font-family:"IBM Plex Mono",monospace; font-size:11px; opacity:.7; margin-left:4px}

/* ---------- match rows ---------- */
.section-label{font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-3);
  font-weight:600; margin:22px 0 8px}
.section-label:first-child{margin-top:0}
.matches{display:flex; flex-direction:column; gap:7px}
.match{
  display:grid; grid-template-columns:76px minmax(0,1fr) auto; gap:14px; align-items:center;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
  padding:11px 14px; box-shadow:var(--shadow);
}
.match .when{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-2); line-height:1.35}
.match .when b{display:block; font-weight:600; color:var(--ink); font-size:13px}
.match .who{min-width:0}
.match .who .opp{font-family:Archivo; font-weight:600; font-size:15.5px; line-height:1.25}
.match .who .meta{font-size:11.5px; color:var(--ink-3); margin-top:2px}
.match .ha{
  font-size:10px; font-weight:700; letter-spacing:.07em; padding:1px 5px; border-radius:4px;
  border:1px solid var(--line-hard); color:var(--ink-3); vertical-align:2px; margin-left:7px;
}
.match .ha.h{background:var(--brand-wash); color:var(--brand); border-color:transparent}
.score{
  font-family:Archivo; font-weight:700; font-size:20px; font-variant-numeric:tabular-nums;
  white-space:nowrap; display:flex; align-items:center; gap:9px;
}
.score .wl{
  width:22px; height:22px; border-radius:5px; display:grid; place-items:center;
  font-size:11.5px; font-weight:700; font-family:"IBM Plex Sans",sans-serif;
}
.wl.W{background:var(--win-wash); color:var(--win)}
.wl.L{background:var(--hard-wash); color:var(--hard)}
.wl.D{background:var(--even-wash); color:var(--even)}
.wl.N{background:var(--none-wash); color:var(--none)}

/* ---------- rating chip ---------- */
.chip{
  display:inline-flex; align-items:center; gap:7px; padding:4px 10px 4px 7px;
  border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap; border:1px solid transparent;
}
.chip .dot{width:8px; height:8px; border-radius:50%; flex:0 0 auto}
.chip.green{background:var(--win-wash); color:var(--win); border-color:var(--win)}
.chip.green .dot{background:var(--win)}
.chip.yellow{background:var(--even-wash); color:var(--even); border-color:var(--even)}
.chip.yellow .dot{background:var(--even)}
.chip.red{background:var(--hard-wash); color:var(--hard); border-color:var(--hard)}
.chip.red .dot{background:var(--hard)}
.chip.grey{background:var(--none-wash); color:var(--none); border-color:var(--line-hard)}
.chip.grey .dot{background:var(--none)}

/* ---------- next-up callout ---------- */
.nextup{
  display:grid; grid-template-columns:5px minmax(0,1fr); gap:0; border:1px solid var(--line);
  border-radius:var(--r); overflow:hidden; background:var(--panel); margin-bottom:22px; box-shadow:var(--shadow);
}
.nextup .stripe{background:var(--none)}
.nextup.green .stripe{background:var(--win)}
.nextup.yellow .stripe{background:var(--even)}
.nextup.red .stripe{background:var(--hard)}
.nextup .body{padding:14px 16px}
.nextup .eyebrow{font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-3); font-weight:600}
.nextup h3{font-size:19px; font-weight:700; margin:4px 0 3px}
.nextup .line{font-size:13px; color:var(--ink-2)}
.nextup .verdict{margin-top:11px; display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.nextup .verdict p{margin:0; font-size:13px; color:var(--ink-2)}

/* ---------- tables ---------- */
.tablewrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--panel);
  box-shadow:var(--shadow); margin-bottom:8px}
table{border-collapse:collapse; width:100%; font-size:13.5px}
th,td{padding:8px 11px; text-align:right; white-space:nowrap; border-bottom:1px solid var(--line)}
th:nth-child(2),td:nth-child(2){text-align:left; white-space:normal; min-width:150px}
th{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-3);
  font-weight:600; background:var(--sunken); position:sticky; top:0}
tbody tr:last-child td{border-bottom:0}
td{font-variant-numeric:tabular-nums; font-family:"IBM Plex Mono",monospace; font-size:12.5px}
td:nth-child(2){font-family:"IBM Plex Sans",sans-serif; font-size:13.5px}
tr.us td{background:var(--brand-wash); font-weight:600}
tr.us td:nth-child(2){color:var(--brand)}
.pts{font-weight:700}
.note{font-size:11.5px; color:var(--ink-3); margin:6px 2px 20px; max-width:70ch}

/* ---------- scout ---------- */
.controls{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom:20px;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; box-shadow:var(--shadow)}
.field{display:flex; flex-direction:column; gap:5px; min-width:190px; flex:1 1 190px}
.field label{font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3); font-weight:600}
select{
  font:inherit; font-size:14px; padding:8px 10px; border:1px solid var(--line-hard); border-radius:7px;
  background:var(--panel); color:var(--ink); width:100%;
}
.cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:14px; align-items:start}
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:15px 16px;
  box-shadow:var(--shadow)}
.card h4{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3);
  font-weight:600; margin-bottom:11px}
.formstrip{display:flex; gap:4px; margin-bottom:11px}
.formstrip span{width:24px; height:24px; border-radius:5px; display:grid; place-items:center;
  font-size:12px; font-weight:700; font-family:"IBM Plex Sans",sans-serif}
.kv{display:flex; justify-content:space-between; gap:12px; padding:5px 0; border-bottom:1px dashed var(--line); font-size:13px}
.kv:last-child{border-bottom:0}
.kv span:last-child{font-family:"IBM Plex Mono",monospace; font-weight:500; font-variant-numeric:tabular-nums}
.signals{list-style:none; padding:0; margin:10px 0 0; display:flex; flex-direction:column; gap:9px}
.signals li{display:grid; grid-template-columns:auto minmax(0,1fr); gap:10px; font-size:12.5px; align-items:start}
.signals .w{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3); padding-top:1px}
.signals .d{color:var(--ink-2)}
.signals .lbl{font-weight:600; color:var(--ink)}
.empty{color:var(--ink-3); font-size:13.5px; padding:16px 2px; font-style:italic}
footer .setuplink{display:inline-block; margin-bottom:12px; font-weight:600; font-size:13.5px;
  text-decoration:none; color:var(--ink); border:1px solid var(--line-hard);
  padding:8px 13px; border-radius:8px; background:var(--panel)}
footer .setuplink:hover{border-color:var(--brand)}
footer{border-top:1px solid var(--line); margin-top:34px; padding-top:14px; font-size:11.5px; color:var(--ink-3); max-width:80ch}
footer a{color:var(--ink-2)}
</style>

  <div>
    <h1>Ballincollig RFC Match Centre</h1>
    <div class="sub" id="seasonLabel">Season</div>
  </div>
  <div class="spacer"></div>
  <div class="freshness">
    <button class="btn ghost" data-scout="1">Scout an opponent</button>
    <div class="stamp" id="stamp">&nbsp;</div>
  </div>
</header>
<div class="hoops" aria-hidden="true"></div>

<div class="shell">
  <nav class="side" id="side" aria-label="Teams"></nav>
  <main class="main" id="main"></main>
</div>

<script>
const SEED = /*__SEED__*/null/*__END__*/;
let DATA = SEED;
let view = {kind:"team", teamId:SEED.teams[0].id, tab:"fixtures"};
let scout = {teamId:SEED.teams[0].id, opponent:null};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DAY = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

function fmtDate(iso){
  if(!iso) return {top:"TBC", bot:""};
  const d = new Date(iso+"T12:00:00");
  if(isNaN(d)) return {top:"TBC", bot:""};
  return {top:`${d.getDate()} ${MON[d.getMonth()]}`, bot:DAY[d.getDay()]};
}
const team = id => DATA.teams.find(t => t.id===id) || DATA.teams[0];
const BAND = {green:"Favourites", yellow:"Evenly matched", red:"Tough", grey:"No read yet"};

function chip(r){
  const b = (r && r.band) || "grey";
  return `<span class="chip ${b}" title="${esc((r&&r.summary)||"")}"><span class="dot"></span>${BAND[b]}</span>`;
}
function haTag(home){
  if(home===true) return '<span class="ha h">HOME</span>';
  if(home===false) return '<span class="ha">AWAY</span>';
  return "";
}

/* ---------- sidebar ---------- */
function renderSide(){
  const groups = [];
  DATA.teams.forEach(t => {
    let g = groups.find(x => x.name===t.group);
    if(!g){ g = {name:t.group, teams:[]}; groups.push(g); }
    g.teams.push(t);
  });
  let h = `<button class="navbtn scoutnav" data-scout="1" aria-current="${view.kind==="scout"}">
      <span class="ico" aria-hidden="true">◎</span>Scout an opponent</button><hr>`;
  groups.forEach(g => {
    h += `<div class="grp">${esc(g.name)}</div>`;
    g.teams.forEach(t => {
      const r = t.record;
      const rec = r.p ? `${r.w}-${r.d}-${r.l}` : "—";
      h += `<button class="navbtn" data-team="${t.id}" aria-current="${view.kind==="team"&&view.teamId===t.id}">
        ${esc(t.short)}<span class="rec">${rec}</span></button>`;
    });
  });
  $("#side").innerHTML = h;
}

/* ---------- match rows ---------- */
function fixtureRow(f){
  const d = fmtDate(f.date);
  return `<div class="match">
    <div class="when"><b>${d.top}</b>${d.bot}${f.time?" · "+esc(f.time):""}</div>
    <div class="who">
      <div class="opp">${esc(f.opponent)}${haTag(f.home)}</div>
      <div class="meta">${esc(f.comp)}${f.round?" · "+esc(f.round):""}${f.venue?" · "+esc(f.venue):""}</div>
    </div>
    ${chip(f.rating)}
  </div>`;
}
function resultRow(r){
  const d = fmtDate(r.date);
  const o = r.outcome || "N";
  const sc = (r.pf==null||r.pa==null) ? "—" : `${r.pf}–${r.pa}`;
  return `<div class="match">
    <div class="when"><b>${d.top}</b>${d.bot}</div>
    <div class="who">
      <div class="opp">${esc(r.opponent)}${haTag(r.home)}</div>
      <div class="meta">${esc(r.comp)}${r.round?" · "+esc(r.round):""}${r.venue?" · "+esc(r.venue):""}</div>
    </div>
    <div class="score"><span class="wl ${o}">${o==="N"?"–":o}</span>${sc}</div>
  </div>`;
}

/* ---------- league tables ---------- */
const COLS = [
  ["pld","P"],["w","W"],["d","D"],["l","L"],["bp","BP"],
  ["f","PF"],["a","PA"],["diff","Diff"],["tries","T"],["pts","Pts"]
];
function tableBlock(tb){
  const present = COLS.filter(([k]) => tb.rows.some(r => r[k]!=null));
  const ours = tb.ourTeams.map(x => x.toLowerCase());
  let h = `<div class="section-label">${esc(tb.name)}</div><div class="tablewrap"><table>
    <thead><tr><th>#</th><th>Team</th>${present.map(([,l])=>`<th>${l}</th>`).join("")}</tr></thead><tbody>`;
  tb.rows.forEach((r,i) => {
    const us = ours.includes(String(r.team||"").toLowerCase());
    h += `<tr class="${us?"us":""}"><td>${i+1}</td><td>${esc(r.team)}</td>` +
      present.map(([k]) => `<td class="${k==="pts"?"pts":""}">${r[k]==null?"–":r[k]}</td>`).join("") + "</tr>";
  });
  h += `</tbody></table></div><div class="note">Ordered as Munster Rugby publishes it. The site's own position column is not
    populated this season, so the # is the published row order, not a calculated rank.
    <a href="${esc(tb.url)}" target="_blank" rel="noopener">View on Munster Rugby</a></div>`;
  return h;
}

/* ---------- team view ---------- */
function renderTeam(){
  const t = team(view.teamId);
  const r = t.record;
  const next = t.fixtures.find(f => !f.date || f.date >= DATA.generatedDate) || t.fixtures[0];

  let h = `<div class="teamhead">
    <div>
      <h2>${esc(t.name)}</h2>
      <div class="comps">${t.competitions.map(c =>
        `<a class="tag" href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.name)}</a>`).join("")}</div>
    </div>
    <div class="record">
      <div><div class="k">Played</div><div class="v">${r.p}</div></div>
      <div><div class="k">W</div><div class="v">${r.w}</div></div>
      <div><div class="k">D</div><div class="v">${r.d}</div></div>
      <div><div class="k">L</div><div class="v">${r.l}</div></div>
      <div><div class="k">Pts for</div><div class="v">${r.pf}</div></div>
      <div><div class="k">Against</div><div class="v">${r.pa}</div></div>
    </div>
  </div>`;

  if(next){
    const b = (next.rating && next.rating.band) || "grey";
    const d = fmtDate(next.date);
    h += `<div class="nextup ${b}"><div class="stripe"></div><div class="body">
      <div class="eyebrow">Next up</div>
      <h3>${esc(next.opponent)}</h3>
      <div class="line">${d.top} ${d.bot?"("+d.bot+")":""}${next.time?" · "+esc(next.time):""} · ${esc(next.comp)}
        · ${next.home===true?"Tanner Park":esc(next.venue||"venue TBC")}</div>
      <div class="verdict">${chip(next.rating)}<p>${esc((next.rating&&next.rating.summary)||"")}</p></div>
    </div></div>`;
  }

  const tabs = [["fixtures","Fixtures",t.fixtures.length],["results","Results",t.results.length],
                ["table","Tables",t.tables.length]];
  h += `<div class="tabs" role="tablist">` + tabs.map(([k,l,n]) =>
    `<button class="tab" role="tab" data-tab="${k}" aria-selected="${view.tab===k}">${l}<span class="n">${n}</span></button>`
  ).join("") + `</div>`;

  if(view.tab==="fixtures"){
    h += t.fixtures.length
      ? `<div class="matches">${t.fixtures.map(fixtureRow).join("")}</div>`
      : `<div class="empty">No fixtures published for this side yet.</div>`;
  } else if(view.tab==="results"){
    h += t.results.length
      ? `<div class="matches">${t.results.map(resultRow).join("")}</div>`
      : `<div class="empty">No results played yet this season.</div>`;
  } else {
    h += t.tables.length
      ? t.tables.map(tableBlock).join("")
      : `<div class="empty">This side plays cup and friendly rugby only, so there is no league table.</div>`;
  }
  $("#main").innerHTML = h + footerHTML();
}

/* ---------- scout view ---------- */
function renderScout(){
  const t = team(scout.teamId);
  const opps = t.opponents;
  if(!opps.some(o => o.name===scout.opponent)) scout.opponent = opps.length ? opps[0].name : null;
  const o = opps.find(x => x.name===scout.opponent);

  let h = `<div class="teamhead"><div>
      <h2>Scout an opponent</h2>
      <div class="comps"><span class="tag">Pick the Ballincollig side, then the club you want a read on</span></div>
    </div></div>
    <div class="controls">
      <div class="field"><label for="selTeam">Age group / side</label>
        <select id="selTeam">${DATA.teams.map(x =>
          `<option value="${x.id}" ${x.id===scout.teamId?"selected":""}>${esc(x.group)} — ${esc(x.name)}</option>`).join("")}</select></div>
      <div class="field"><label for="selOpp">Opponent</label>
        <select id="selOpp">${opps.map(x =>
          `<option value="${esc(x.name)}" ${x.name===scout.opponent?"selected":""}>${esc(x.name)}</option>`).join("")}</select></div>
    </div>`;

  if(!o){ $("#main").innerHTML = h + `<div class="empty">No opponents on record for this side yet.</div>` + footerHTML(); return; }

  const f = o.form, R = o.rating || {};
  const nm = o.nextMeeting;

  h += `<div class="cards">
    <div class="card">
      <h4>Verdict</h4>
      ${chip(R)}
      <p style="margin:10px 0 0;font-size:13.5px;color:var(--ink-2)">${esc(R.summary||"")}</p>
      ${R.confidence&&R.confidence!=="none"?`<p style="margin:7px 0 0;font-size:11.5px;color:var(--ink-3)">Confidence: ${esc(R.confidence)}</p>`:""}
      ${(R.signals&&R.signals.length)?`<ul class="signals">${R.signals.map(s =>
        `<li><span class="w">${Math.round(s.weight*100)}%</span><span class="d"><span class="lbl">${esc(s.label)}</span> — ${esc(s.detail)}</span></li>`).join("")}</ul>`:""}
    </div>

    <div class="card">
      <h4>Last ${Math.min(5,f.played)||5} results</h4>
      ${f.played ? `<div class="formstrip">${f.last5.map(r =>
        `<span class="wl ${r.outcome}" title="${esc(r.date||"")} v ${esc(r.opponent)} ${r.pf}-${r.pa}">${r.outcome}</span>`).join("")}</div>
        ${f.last5.map(r => `<div class="kv"><span>${esc(r.opponent)}</span><span>${r.pf}–${r.pa}</span></div>`).join("")}
        <div class="kv" style="margin-top:6px;border-top:1px solid var(--line);border-bottom:0;padding-top:8px">
          <span>Average margin</span><span>${r0(f.avgMargin)}</span></div>`
        : `<div class="empty" style="padding:4px 0">No results on record for them yet.</div>`}
    </div>

    <div class="card">
      <h4>Where they stand</h4>
      <div class="kv"><span>Competition</span><span style="font-family:inherit">${esc(o.comp)}</span></div>
      ${o.tableRow ? `
        <div class="kv"><span>Played</span><span>${o.tableRow.pld==null?"–":o.tableRow.pld}</span></div>
        <div class="kv"><span>W / D / L</span><span>${o.tableRow.w||0} / ${o.tableRow.d||0} / ${o.tableRow.l||0}</span></div>
        <div class="kv"><span>League points</span><span>${o.tableRow.pts==null?"–":o.tableRow.pts}</span></div>`
        : `<div class="kv"><span>League table</span><span style="font-family:inherit">Knockout / friendly</span></div>`}
      ${nm ? `<div class="kv"><span>Next meeting</span><span style="font-family:inherit">${fmtDate(nm.date).top}${nm.home===true?" at Tanner Park":nm.home===false?" away":""}</span></div>`
           : `<div class="kv"><span>Next meeting</span><span style="font-family:inherit">None scheduled</span></div>`}
      ${o.headToHead.length ? o.headToHead.map(r =>
        `<div class="kv"><span>Played ${fmtDate(r.date).top}</span><span>${r.pf}–${r.pa} ${r.outcome||""}</span></div>`).join("") : ""}
    </div>
  </div>`;

  if(R.commonOpponents && R.commonOpponents.length){
    h += `<div class="section-label">Common opponents</div><div class="tablewrap"><table>
      <thead><tr><th>#</th><th>Both played</th><th>Ballincollig</th><th>Margin</th><th>${esc(o.name)}</th><th>Margin</th><th>Swing</th></tr></thead><tbody>`;
    R.commonOpponents.forEach((c,i) => {
      h += `<tr><td>${i+1}</td><td>${esc(c.opponent)}</td><td>${esc(c.ballincolligScore)}</td>
        <td>${c.ballincolligMargin>0?"+":""}${c.ballincolligMargin}</td><td>${esc(c.opponentScore)}</td>
        <td>${c.opponentMargin>0?"+":""}${c.opponentMargin}</td><td class="pts">${c.diff>0?"+":""}${c.diff}</td></tr>`;
    });
    h += `</tbody></table></div><div class="note">Swing is how much better Ballincollig did against the same club.
      A positive swing favours Ballincollig. This carries the most weight in the verdict.</div>`;
  }

  h += `<div class="note" style="margin-top:22px">Everything on this card is calculated from published
      scorelines. Line-ups are not shown: Munster Rugby's team sheets sit behind club-admin sign-in,
      so there is no public player-level data to work from.</div>`;

  $("#main").innerHTML = h + footerHTML();
}
const r0 = v => v==null ? "–" : (v>0?"+":"")+v;

/* ---------- footer ---------- */
const SETUP_LINK = /*SETUP_START*/'<a class="setuplink" href="setup.html">New here? Put the Match Centre on your phone &rarr;</a>'/*SETUP_END*/;
function footerHTML(){
  return `<footer>${SETUP_LINK}
    Fixtures, results and tables come from Munster Rugby's domestic competition system at
    <a href="https://munsterrugby.sportlomo.com/" target="_blank" rel="noopener">munsterrugby.sportlomo.com</a>,
    the same source behind the
    <a href="https://www.munsterrugby.ie/domestic-fixtures-results" target="_blank" rel="noopener">Domestic Fixtures &amp; Results</a> page.
    Rebuilt daily; this copy was pulled ${esc(DATA.generatedAt||"")}. The green / amber / red read is a calculation from published scores,
    not a prediction — it weighs common opponents (45%), league points per game (25%), recent form (20%) and venue (10%),
    and stays grey until there is played rugby to work from.
  </footer>`;
}

/* ---------- render ---------- */
function render(){
  $("#seasonLabel").textContent = `Munster domestic · Season ${DATA.season}`;
  $("#stamp").innerHTML = `Data as of<br>${esc((DATA.generatedAt||"").replace("T"," ").slice(0,16))}`;
  renderSide();
  if(view.kind==="scout") renderScout(); else renderTeam();
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const nav = e.target.closest("[data-team]");
  if(nav){ view = {kind:"team", teamId:nav.dataset.team, tab:"fixtures"}; render(); return; }
  if(e.target.closest("[data-scout]")){ view = {kind:"scout"}; render(); return; }
  const tab = e.target.closest("[data-tab]");
  if(tab){ view.tab = tab.dataset.tab; render(); return; }
});
document.addEventListener("change", e => {
  if(e.target.id==="selTeam"){ scout.teamId = e.target.value; scout.opponent = null; renderScout(); }
  if(e.target.id==="selOpp"){ scout.opponent = e.target.value; renderScout(); }
});

render();
</script>
